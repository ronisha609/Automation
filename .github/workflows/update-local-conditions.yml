name: Local Pulse data refresh

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: local-pulse-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: local-pulse
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect public local-condition data
        run: python update_dashboard_data.py --output data/local_conditions.json

      - name: Publish refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/local_conditions.json
          if git diff --cached --quiet; then
            echo "No data changes to publish."
          else
            git commit -m "Refresh local conditions dashboard data"
            git pull --rebase
            git push
          fi
